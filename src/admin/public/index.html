<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-CON BOT | Master Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* Login Screen */
        #login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }

        .login-card {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .login-card h1 {
            margin-bottom: 2rem;
            font-size: 2rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        input {
            width: 100%;
            padding: 1rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.5);
            color: white;
            margin-bottom: 1.5rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 1rem;
            border-radius: 0.75rem;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        /* Sidebar */
        aside {
            width: 280px;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            padding: 2rem;
            height: 100vh;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 3rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .nav-item {
            padding: 1rem;
            border-radius: 0.75rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text-dim);
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(99, 102, 241, 0.1);
            color: white;
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 3rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }

        .instance-card {
            background: var(--card-bg);
            border-radius: 1.5rem;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }

        .instance-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-online { background: rgba(34, 197, 94, 0.1); color: var(--success); }
        .status-connected { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid var(--success); }
        .status-waiting { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
        .status-disconnected { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .status-stopped { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .status-launching { background: rgba(245, 158, 11, 0.1); color: var(--warning); }

        .instance-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
        }

        .instance-info h3 { font-size: 1.25rem; margin-bottom: 0.25rem; }
        .instance-info span { color: var(--text-dim); font-size: 0.875rem; }

        .metrics {
            display: flex;
            gap: 2rem;
            margin: 1.5rem 0;
            padding: 1rem 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .metric { display: flex; flex-direction: column; gap: 0.25rem; }
        .metric label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; }
        .metric value { font-weight: 600; }

        .actions {
            display: flex;
            gap: 1rem;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-icon:hover { background: rgba(255, 255, 255, 0.1); transform: scale(1.1); }
        .btn-icon.play:hover { color: var(--success); border-color: var(--success); }
        .btn-icon.stop:hover { color: var(--danger); border-color: var(--danger); }
        .btn-icon.refresh:hover { color: var(--primary); border-color: var(--primary); }

        /* Animations */
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .pulse { animation: pulse 2s infinite; }

    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h1>P-CON BOT</h1>
            <input type="password" id="admin-pass" placeholder="Senha do Servidor">
            <button onclick="login()">Acessar Painel</button>
            <p id="login-error" style="color: var(--danger); margin-top: 1rem; font-size: 0.875rem; display: none;"></p>
        </div>
    </div>

    <aside>
        <div class="logo">
            <i class="fas fa-robot" style="color: var(--primary);"></i>
            <span>P-CON BOT</span>
        </div>
        <div class="nav-item active" onclick="switchView('dashboard', this)">
            <i class="fas fa-th-large"></i>
            <span>Dashboard</span>
        </div>
        <div class="nav-item" onclick="switchView('settings', this)">
            <i class="fas fa-cog"></i>
            <span>Configurações</span>
        </div>
        <div class="nav-item" onclick="switchView('logs', this)">
            <i class="fas fa-history"></i>
            <span>Logs Master</span>
        </div>
        <div style="margin-top: auto;">
            <div class="nav-item" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span>Sair</span>
            </div>
        </div>
    </aside>

    <main>
        <header>
            <div>
                <h1 style="font-size: 2.5rem;">P-CON BOT</h1>
                <p style="color: var(--text-dim);">Monitoramento de todas as instâncias do servidor</p>
            </div>
            <div id="server-status" style="display: flex; align-items: center; gap: 0.5rem; background: rgba(34, 197, 94, 0.1); padding: 0.5rem 1rem; border-radius: 1rem;">
                <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--success);" class="pulse"></span>
                <span style="color: var(--success); font-weight: 600; font-size: 0.875rem;">Servidor Online</span>
            </div>
        </header>

        <div id="view-dashboard">
            <div class="stats-grid" id="instance-grid">
                <!-- Cards will be injected here -->
            </div>
        </div>

        <div id="view-settings" style="display: none;">
            <div class="instance-card" style="width: 100%; max-width: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h2>Gerenciar Instâncias</h2>
                    <button style="width: auto; padding: 0.5rem 1.5rem;" onclick="editInstance({})">+ Nova Instância</button>
                </div>
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="border-bottom: 1px solid rgba(255,255,255,0.1);">
                            <th style="padding: 1rem;">Nome</th>
                            <th style="padding: 1rem;">Slug/ID</th>
                            <th style="padding: 1rem;">Porta</th>
                            <th style="padding: 1rem;">Status</th>
                            <th style="padding: 1rem;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="settings-table-body">
                        <!-- Rows injected here -->
                    </tbody>
                </table>
            </div>
        </div>

        <div id="view-logs" style="display: none;">
            <div class="instance-card" style="width: 100%; max-width: none; background: #000;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h2 style="color: var(--primary);">Terminal Log</h2>
                    <div style="display: flex; gap: 1rem;">
                        <select id="log-process" style="padding: 0.25rem 1rem; border-radius: 0.5rem; background: var(--card-bg); color: white; border: 1px solid rgba(255,255,255,0.1);" onchange="loadLogs()">
                            <option value="pcon-admin">Admin Server</option>
                            <option value="bot-dyoli">Dyoli (P1)</option>
                            <option value="bot-natan">Natan (P2)</option>
                            <option value="bot-fernanda">Fernanda (P3)</option>
                            <option value="bot-estudio5">Estúdio 5 (P5)</option>
                        </select>
                        <button style="width: auto; padding: 0.25rem 1rem; background: transparent; border: 1px solid var(--primary);" onclick="loadLogs()">Atualizar</button>
                    </div>
                </div>
                <div id="log-container" style="font-family: 'Courier New', Courier, monospace; font-size: 0.875rem; color: #0f0; height: 500px; overflow-y: auto; padding: 1rem; line-height: 1.5;">
                    > Aguardando logs...
                </div>
            </div>
        </div>

        <!-- Modal de Edição -->
        <div id="modal-edit" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center;">
            <div class="login-card" style="max-width: 600px; text-align: left;">
                <h2 id="modal-title" style="margin-bottom: 1.5rem;">Editar Instância</h2>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div>
                        <label style="font-size: 0.75rem; color: var(--text-dim);">NOME</label>
                        <input type="text" id="edit-name" placeholder="Ex: Fernanda Tattoo">
                    </div>
                    <div>
                        <label style="font-size: 0.75rem; color: var(--text-dim);">SLUG (ID ÚNICO)</label>
                        <input type="text" id="edit-slug" placeholder="Ex: fernanda">
                    </div>
                    <div>
                        <label style="font-size: 0.75rem; color: var(--text-dim);">PORTA</label>
                        <input type="number" id="edit-port" placeholder="Ex: 3003">
                    </div>
                    <div>
                        <label style="font-size: 0.75rem; color: var(--text-dim);">SITE URL</label>
                        <input type="text" id="edit-website" placeholder="https://...">
                    </div>
                </div>
                <label style="font-size: 0.75rem; color: var(--text-dim);">SUPABASE URL</label>
                <input type="text" id="edit-supa-url">
                <label style="font-size: 0.75rem; color: var(--text-dim);">SUPABASE KEY</label>
                <input type="text" id="edit-supa-key">
                
                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <button style="background: var(--card-bg);" onclick="closeModal()">Cancelar</button>
                    <button onclick="saveInstance()">Salvar Alterações</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let token = localStorage.getItem('admin_token');

        if (token) {
            document.getElementById('login-overlay').style.display = 'none';
            loadInstances();
        }

        async function login() {
            const password = document.getElementById('admin-pass').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            const data = await res.json();
            if (data.token) {
                token = data.token;
                localStorage.setItem('admin_token', token);
                document.getElementById('login-overlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('login-overlay').style.display = 'none';
                    loadInstances();
                }, 500);
            } else {
                const err = document.getElementById('login-error');
                err.textContent = data.error;
                err.style.display = 'block';
            }
        }

        function logout() {
            localStorage.removeItem('admin_token');
            location.reload();
        }

        let instancesData = [];

        function switchView(view, el) {
            document.querySelectorAll('[id^="view-"]').forEach(v => v.style.display = 'none');
            document.getElementById(`view-${view}`).style.display = 'block';
            
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');

            if (view === 'settings') renderSettings();
            if (view === 'logs') loadLogs();
        }

        async function loadInstances() {
            try {
                const res = await fetch('/api/instances', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.status === 401) return logout();
                instancesData = await res.json();
                renderInstances(instancesData);
                if (document.getElementById('view-settings').style.display === 'block') {
                    renderSettings();
                }
            } catch (err) {
                console.error('Erro ao carregar instâncias:', err);
            }
        }

        function renderSettings() {
            const tbody = document.getElementById('settings-table-body');
            tbody.innerHTML = '';
            instancesData.forEach(inst => {
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
                tr.innerHTML = `
                    <td style="padding: 1rem;">${inst.name}</td>
                    <td style="padding: 1rem; color: var(--primary);">${inst.slug}</td>
                    <td style="padding: 1rem;">${inst.port}</td>
                    <td style="padding: 1rem;"><span class="status-badge status-${inst.status}">${inst.status}</span></td>
                    <td style="padding: 1rem;">
                        <button style="width: auto; padding: 0.25rem 0.75rem; font-size: 0.75rem; background: rgba(255,255,255,0.05);" onclick='editInstance(${JSON.stringify(inst)})'>Editar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function editInstance(inst) {
            document.getElementById('edit-name').value = inst.name || '';
            document.getElementById('edit-slug').value = inst.slug || '';
            document.getElementById('edit-port').value = inst.port || '';
            document.getElementById('edit-website').value = inst.website_url || '';
            document.getElementById('edit-supa-url').value = inst.supabase_url || '';
            document.getElementById('edit-supa-key').value = inst.supabase_key || '';
            
            document.getElementById('modal-edit').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-edit').style.display = 'none';
        }

        async function saveInstance() {
            const data = {
                name: document.getElementById('edit-name').value,
                slug: document.getElementById('edit-slug').value,
                port: parseInt(document.getElementById('edit-port').value),
                website_url: document.getElementById('edit-website').value,
                supabase_url: document.getElementById('edit-supa-url').value,
                supabase_key: document.getElementById('edit-supa-key').value
            };

            const res = await fetch('/api/instances/save', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                closeModal();
                loadInstances();
            } else {
                alert('Erro ao salvar!');
            }
        }

        async function loadLogs() {
            const container = document.getElementById('log-container');
            const process = document.getElementById('log-process').value;
            container.innerHTML = `> Buscando logs de ${process}...<br>`;
            try {
                const res = await fetch(`/api/logs?name=${process}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                container.innerHTML = `[${process.toUpperCase()} LOGS]<br>${new Date().toLocaleString()}<br><hr style="border:0;border-top:1px solid #333;margin:1rem 0;"><br>${data.logs}`;
                container.scrollTop = container.scrollHeight;
            } catch (err) {
                container.innerHTML = 'Erro ao carregar logs.';
            }
        }

        function renderInstances(instances) {
            const grid = document.getElementById('instance-grid');
            grid.innerHTML = '';
            instances.forEach(inst => {
                const card = document.createElement('div');
                card.className = 'instance-card';
                const whatsappStatusClass = inst.whatsappStatus === 'conectado' ? 'status-connected' : (inst.whatsappStatus === 'aguardando qr' ? 'status-waiting' : 'status-disconnected');
                card.innerHTML = `
                    <div class="instance-header">
                        <div class="instance-info">
                            <h3>${inst.name}</h3>
                            <span>Porta: ${inst.port} | ID: ${inst.slug}</span>
                        </div>
                        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem;">
                            <span class="status-badge status-${inst.status}">${inst.status}</span>
                            <span class="status-badge ${whatsappStatusClass}">${inst.whatsappStatus}</span>
                        </div>
                    </div>
                    <div class="metrics">
                        <div class="metric">
                            <label>Memória</label>
                            <value>${inst.memory || 0} MB</value>
                        </div>
                        <div class="metric">
                            <label>CPU</label>
                            <value>${inst.cpu || 0}%</value>
                        </div>
                        <div class="metric">
                            <label>Uptime</label>
                            <value>${formatUptime(inst.uptime)}</value>
                        </div>
                    </div>
                    <div class="actions">
                        <div class="btn-icon play" onclick="control('${inst.slug}', 'start')" title="Iniciar">
                            <i class="fas fa-play"></i>
                        </div>
                        <div class="btn-icon refresh" onclick="control('${inst.slug}', 'restart')" title="Reiniciar">
                            <i class="fas fa-sync"></i>
                        </div>
                        <div class="btn-icon stop" onclick="control('${inst.slug}', 'stop')" title="Parar">
                            <i class="fas fa-stop"></i>
                        </div>
                        ${inst.whatsappStatus === 'aguardando qr' ? `
                        <div class="btn-icon" onclick="window.open('http://' + window.location.hostname + ':${inst.port}/api/status', '_blank')" title="Ver QR Code" style="color: var(--primary); border-color: var(--primary);">
                            <i class="fas fa-qrcode"></i>
                        </div>
                        ` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function control(slug, action) {
            const res = await fetch('/api/control', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ slug, action })
            });
            if (res.ok) {
                setTimeout(loadInstances, 2000);
            }
        }

        function formatUptime(ms) {
            if (!ms) return '0m';
            const sec = Math.floor(ms / 1000);
            const min = Math.floor(sec / 60);
            const hrs = Math.floor(min / 60);
            if (hrs > 0) return `${hrs}h ${min % 60}m`;
            return `${min}m`;
        }

        // Auto Refresh
        setInterval(loadInstances, 10000);

    </script>
</body>
</html>
